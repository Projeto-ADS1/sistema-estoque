name: Testes E2E com Cypress

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: estoque
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -uroot -prootpassword" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências do Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar as Tabelas no MySQL do GitHub usando o schema.sql
        run: |
          mysql -h 127.0.0.1 -u root -prootpassword estoque < schema.sql

      - name: Executar Testes Cypress no GitHub
        uses: cypress-io/github-action@v6
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: estoque
          DB_USER: root
          DB_PASSWORD: rootpassword
        with:
          start: python app.py
          wait-on: 'http://127.0.0.1:5000'
          wait-on-timeout: 120
          browser: electron
          install: false
