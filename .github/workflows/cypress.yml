name: Testes E2E com Cypress

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    # Adicionamos um container MySQL rodando em segundo plano no GitHub
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: estoque
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -uroot -prootpassword" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências do Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar as Tabelas no MySQL do GitHub
        run: |
          python -c "
          import mysql.connector
          conn = mysql.connector.connect(host='localhost', user='root', password='rootpassword', database='estoque')
          cursor = conn.cursor()
          cursor.execute('''CREATE TABLE categoria (id INT NOT NULL AUTO_INCREMENT, nome VARCHAR(60) NOT NULL, CONSTRAINT pk_categoria PRIMARY KEY (id), CONSTRAINT uq_categoria_nome UNIQUE (nome)) ENGINE = InnoDB DEFAULT CHARSET = utf8mb4;''')
          cursor.execute('''CREATE TABLE produto (id INT NOT NULL AUTO_INCREMENT, sku VARCHAR(20) NOT NULL, nome VARCHAR(120) NOT NULL, preco DECIMAL(10, 2) NOT NULL, quantidade INT NOT NULL DEFAULT 0, categoria_id INT NOT NULL, criado_em TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP, CONSTRAINT pk_produto PRIMARY KEY (id), CONSTRAINT uq_produto_sku UNIQUE (sku), CONSTRAINT ck_produto_preco CHECK (preco >= 0), CONSTRAINT ck_produto_quantidade CHECK (quantidade >= 0), CONSTRAINT fk_produto_categoria FOREIGN KEY (categoria_id) REFERENCES categoria (id) ON DELETE RESTRICT) ENGINE = InnoDB DEFAULT CHARSET = utf8mb4;''')
          conn.commit()
          cursor.close()
          conn.close()
          "

      - name: Executar Testes Cypress no GitHub
        uses: cypress-io/github-action@v6
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: estoque
          DB_USER: root
          DB_PASSWORD: rootpassword
        with:
          start: python app.py
          wait-on: 'http://127.0.0.1:5000'
          browser: electron
          install: false
